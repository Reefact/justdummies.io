<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — JustDummies</title>
    <!--
      The published output is copied under /playground/ of the combined artefact.
      This must stay in step with StaticWebAssetBasePath in the project file.
    -->
    <base href="/playground/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!--
      Absolute, and pointing outside this application on purpose. The mark belongs to the
      product, not to one half of it, and a copy under /playground/ would be a second file
      to replace the day it changes — the failure being two tabs wearing different icons,
      which is exactly what this replaced.

      Absolute rather than relative because <base href="/playground/"> would otherwise
      resolve these into this directory, where they are deliberately no longer kept. Same
      files, same declarations, as the site's own pages — which is the point, and which is
      why this block changes whenever Base.astro's does.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-64.png" sizes="64x64" />
    <link rel="icon" type="image/png" href="/favicon-128.png" sizes="128x128" />
    <link rel="icon" type="image/png" href="/favicon-256.png" sizes="256x256" />
    <!--
      The scoped-CSS bundle the Blazor template links is deliberately absent. It is only
      emitted when a component has a .razor.css beside it, and none does: this application
      styles itself from the shared design tokens, which is what keeps it looking like the
      site rather than like a Blazor app. Linking a stylesheet that is never built made
      every playground page fetch a 404 and log two console errors — one for the missing
      file, one for the 404 page arriving as text/html where a stylesheet was expected.
    -->
    <script type="importmap"></script>
</head>

<body>
    <!--
      The shell is server-free HTML and paints before a byte of .NET is
      downloaded (§11.10). What replaces it is the same page with values in it,
      so nothing jumps: the runtime download is visible as a state, not as a
      blank screen.
    -->
    <div id="app">
        <div class="boot">
            <p class="boot-title">Playground</p>
            <p class="boot-note">Loading the .NET runtime…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/hero-frame.js"></script>
    <script src="js/locale.js"></script>
    <script src="js/site-header.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
