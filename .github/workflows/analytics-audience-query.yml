name: Analytics audience query

# Manual, on-demand read of Cloudflare Web Analytics (the beacon rendered on every page,
# token PUBLIC_CF_BEACON_TOKEN — see docs/for-maintainers/deployment-en.md, "Step 10 —
# Turn the measurement on"). This is a different product from Analytics Engine
# (analytics-events-query.yml): it captures the audience half — country, referrer, device —
# that the site's own /_event collector deliberately does not.
#
# Queried through Cloudflare's GraphQL Analytics API (api.cloudflare.com/client/v4/graphql),
# not the Analytics Engine SQL endpoint.
#
# THE FILTER IS OPTIONAL, AND EMPTY BY DEFAULT, which is the answer to the thing that cost
# this workflow every result it ever returned. `siteTag` is not the beacon token the page
# carries: it is a separate identifier, and the /rum/site_info/list endpoint that maps one to
# the other answers 403 to this token under every analytics permission tried (Account
# Analytics, Zone Analytics). Filtering on the token therefore named an identifier the account
# does not have, which GraphQL reports as "nothing matched" rather than as a mistake.
#
# The way out is that `siteTag` is also a DIMENSION of this dataset, not only a filter. Asking
# for it unfiltered makes the API report the tag rather than requiring it up front — the data
# comes back, and the tag comes back with it. Pass `site_tag` once it is known and the query
# narrows to that one site; leave it empty and the run enumerates whatever the account holds.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to query'
        required: true
        default: '7'
      site_tag:
        description: 'Site tag to filter on. Leave empty to enumerate every site and report its tag.'
        required: false
        default: ''

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run query against Web Analytics
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_TAG: ${{ inputs.site_tag }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail

          since="$(date -u -d "-${DAYS} days" +'%Y-%m-%dT%H:%M:%SZ')"
          until_="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Two whole queries rather than one with a clause spliced in. The filtered form
          # declares $siteTag and the unfiltered one does not, because a declared-but-unused
          # variable is rejected by some GraphQL servers — and building the filter by string
          # concatenation would put a workflow input inside the query text, which is the one
          # place a value should never be interpolated. Both keep siteTag as a dimension, so
          # every row says which site it came from either way.
          #
          # $accountTag/$siteTag/etc. are GraphQL variable placeholders, not shell variables;
          # the single quotes are what keep bash out of them.
          if [ -n "$SITE_TAG" ]; then
            # shellcheck disable=SC2016
            query='query WebAnalytics($accountTag: string, $siteTag: string, $since: Time, $until: Time) {
              viewer {
                accounts(filter: { accountTag: $accountTag }) {
                  rumPageloadEventsAdaptiveGroups(
                    limit: 100
                    filter: { siteTag: $siteTag, datetime_geq: $since, datetime_leq: $until }
                    orderBy: [count_DESC]
                  ) {
                    count
                    dimensions { siteTag date countryName refererHost deviceType }
                  }
                }
              }
            }'
            # shellcheck disable=SC2016
            variables='{accountTag: $accountTag, siteTag: $siteTag, since: $since, until: $until}'
          else
            # shellcheck disable=SC2016
            query='query WebAnalytics($accountTag: string, $since: Time, $until: Time) {
              viewer {
                accounts(filter: { accountTag: $accountTag }) {
                  rumPageloadEventsAdaptiveGroups(
                    limit: 100
                    filter: { datetime_geq: $since, datetime_leq: $until }
                    orderBy: [count_DESC]
                  ) {
                    count
                    dimensions { siteTag date countryName refererHost deviceType }
                  }
                }
              }
            }'
            # shellcheck disable=SC2016
            variables='{accountTag: $accountTag, since: $since, until: $until}'
          fi

          payload="$(jq -n \
            --arg query "$query" \
            --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" \
            --arg siteTag "$SITE_TAG" \
            --arg since "$since" \
            --arg until "$until_" \
            "{query: \$query, variables: ${variables}}")"

          response="$(curl -sS -w '\n%{http_code}' \
            --connect-timeout 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_ANALYTICS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/graphql")"
          status="$(tail -n1 <<<"$response")"
          response_body="$(sed '$d' <<<"$response")"
          echo "$response_body" > result.json

          {
            echo "### Window"
            echo "$since to $until_"
            echo
            if [ -n "$SITE_TAG" ]; then
              printf "Filtered to site tag \`%s\`.\n" "$SITE_TAG"
            else
              echo "No site filter — every site in the account is reported, each row naming its own tag."
            fi
            echo
            echo "HTTP status: $status"
            echo

            # The tags actually seen, which is what an unfiltered run exists to reveal.
            # jq is given the file rather than the shell variable so a malformed body fails
            # here rather than producing a misleading empty table.
            echo "### Site tags in the result"
            echo
            tags="$(jq -r '[.data.viewer.accounts[]?.rumPageloadEventsAdaptiveGroups[]?.dimensions.siteTag] | unique | .[]?' result.json)"
            if [ -n "$tags" ]; then
              # Double quotes with the backticks escaped: in single quotes a Markdown
              # backtick reads as a command substitution that will never expand (SC2016).
              while IFS= read -r tag; do
                printf -- "- \`%s\`\n" "$tag"
              done <<<"$tags"
            else
              echo "None — the dataset returned no rows at all for this window."
            fi
            echo

            echo "### Result"
            echo "Full response is attached as the \`web-analytics-result\` artifact."
            echo '```json'
            head -c 200000 result.json
            if [ "$(wc -c < result.json)" -gt 200000 ]; then
              echo
              echo "… truncated, see the artifact for the full response …"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ge 300 ]; then
            echo "Query failed with status $status" >&2
            exit 1
          fi

          # GraphQL can answer 200 while carrying a non-empty "errors" array — the HTTP
          # status alone does not tell success from a validation or execution failure.
          errors="$(jq -c '.errors // []' result.json)"
          if [ "$errors" != "[]" ]; then
            echo "Query returned GraphQL errors: $errors" >&2
            exit 1
          fi

      - name: Upload full result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-analytics-result
          path: result.json
          retention-days: 7
