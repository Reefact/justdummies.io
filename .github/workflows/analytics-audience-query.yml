name: Analytics audience query

# Manual, on-demand read of Cloudflare Web Analytics (the beacon rendered on every page,
# token PUBLIC_CF_BEACON_TOKEN — see docs/for-maintainers/deployment-en.md, "Step 10 —
# Turn the measurement on"). This is a different product from Analytics Engine
# (analytics-events-query.yml): it captures the audience half — country, referrer, device —
# that the site's own /_event collector deliberately does not.
#
# Queried through Cloudflare's GraphQL Analytics API (api.cloudflare.com/client/v4/graphql),
# not the Analytics Engine SQL endpoint.
#
# TWO QUERIES, AND THE ORDER MATTERS. `siteTag` is not the beacon token the page carries:
# it is a separate identifier, and /rum/site_info/list — the endpoint that maps one to the
# other — answers 403 to this token under every analytics permission tried (Account
# Analytics, Zone Analytics). Filtering on the token named an identifier the account does
# not have, which GraphQL reports as "nothing matched" rather than as a mistake, and that
# is what made this workflow answer empty for its whole life.
#
# The way out is that `siteTag` is also a DIMENSION, so the API can be asked to name it.
# The first query groups by siteTag AND NOTHING ELSE — which is what keeps this repository,
# whose Actions summaries and artifacts are public, from publishing another site's country
# and referrer breakdown to readers who have no access to the Cloudflare account. Only once
# a single site is settled on does the second query fetch that site's detail.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to query'
        required: true
        default: '7'
      site_tag:
        description: 'Site tag to report on. Leave empty: the run names the tags it finds, and reports detail only if there is exactly one.'
        required: false
        default: ''

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run query against Web Analytics
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_TAG: ${{ inputs.site_tag }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail

          since="$(date -u -d "-${DAYS} days" +'%Y-%m-%dT%H:%M:%SZ')"
          until_="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # One place where a response is turned into a file, so that HTTP status and the
          # GraphQL `errors` array are both checked BEFORE any caller classifies the result.
          # Checking them afterwards is how an execution failure gets reported as "no
          # traffic", which is the wrong answer to give about a measurement.
          run_query() {
            local payload="$1" label="$2" out="$3"
            local response status body errors

            if ! response="$(curl -sS -w '\n%{http_code}' \
                --connect-timeout 10 --max-time 60 \
                -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_ANALYTICS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "https://api.cloudflare.com/client/v4/graphql")"; then
              printf '\n**%s did not reach Cloudflare** — transport failure, no HTTP response.\n' \
                "$label" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi

            status="$(tail -n1 <<<"$response")"
            body="$(sed '$d' <<<"$response")"
            printf '%s\n' "$body" > "$out"

            if [ "$status" -ge 300 ]; then
              printf '\n**%s failed with HTTP %s.**\n' "$label" "$status" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi

            errors="$(jq -c '.errors // []' "$out")"
            if [ "$errors" != "[]" ]; then
              {
                printf '\n**%s returned GraphQL errors** — this is not an empty dataset.\n\n' "$label"
                echo '```json'
                printf '%s\n' "$errors"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi

            return 0
          }

          # $accountTag and friends are GraphQL variable placeholders, not shell variables;
          # the single quotes are what keep bash out of them.
          # shellcheck disable=SC2016
          discover='query DiscoverSites($accountTag: string, $since: Time, $until: Time) {
            viewer {
              accounts(filter: { accountTag: $accountTag }) {
                rumPageloadEventsAdaptiveGroups(
                  limit: 100
                  filter: { datetime_geq: $since, datetime_leq: $until }
                  orderBy: [count_DESC]
                ) {
                  dimensions { siteTag }
                }
              }
            }
          }'

          # shellcheck disable=SC2016
          detail='query SiteAudience($accountTag: string, $siteTag: string, $since: Time, $until: Time) {
            viewer {
              accounts(filter: { accountTag: $accountTag }) {
                rumPageloadEventsAdaptiveGroups(
                  limit: 100
                  filter: { siteTag: $siteTag, datetime_geq: $since, datetime_leq: $until }
                  orderBy: [count_DESC]
                ) {
                  count
                  dimensions { date countryName refererHost deviceType }
                }
              }
            }
          }'

          {
            echo "### Window"
            echo "$since to $until_"
          } >> "$GITHUB_STEP_SUMMARY"

          # ---- 1. Which sites reported anything at all -------------------------------
          #
          # Grouped by siteTag alone: one row per site, so the 100-group cap cannot let a
          # busy site crowd a quiet one out of the list, and no site's country or referrer
          # detail is published by a run that was only meant to find an identifier.
          # shellcheck disable=SC2016
          discover_payload="$(jq -n \
            --arg query "$discover" \
            --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" \
            --arg since "$since" \
            --arg until "$until_" \
            '{query: $query, variables: {accountTag: $accountTag, since: $since, until: $until}}')"

          run_query "$discover_payload" "Site discovery" discovery.json

          # An accountTag that matches nothing comes back as an empty `accounts` array with
          # no GraphQL error at all. Left unchecked, the optional traversal below collapses
          # that into an empty tag list and the run reports "no rows" — a statement about
          # traffic made from an answer that was never about traffic, which is the same
          # mistake as reading an errored response as an empty one.
          matched="$(jq '(.data.viewer.accounts // []) | length' discovery.json)"
          if [ "$matched" -eq 0 ]; then
            {
              echo
              echo "**The account filter matched nothing.** CLOUDFLARE_ACCOUNT_ID names an account this token cannot see, or no account at all. This is a configuration failure, not an empty dataset."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          mapfile -t tags < <(jq -r \
            '[.data.viewer.accounts[]?.rumPageloadEventsAdaptiveGroups[]?.dimensions.siteTag] | unique | .[]?' \
            discovery.json)

          {
            echo
            echo "### Sites reporting in this window"
            echo
            if [ "${#tags[@]}" -eq 0 ]; then
              echo "None. The account returned no rows for this window at all — which, the checks above having passed, is a statement about the data rather than about the query."
            else
              for t in "${tags[@]}"; do
                # Double quotes with the backtick escaped: in single quotes a Markdown
                # backtick reads as a command substitution that will never expand (SC2016).
                printf -- "- \`%s\`\n" "$t"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ---- 2. Which one to report on ---------------------------------------------
          #
          # ONLY AN EXPLICIT TAG UNLOCKS THE DETAIL, and "there was only one" is not a
          # substitute for it. One site reporting in a window is not the same fact as one
          # site existing in the account, and neither is the same fact as the site being
          # this repository's: a week in which justdummies.io saw nobody and a neighbour saw
          # somebody would leave exactly one tag standing, and publishing its countries and
          # referrers here would publish a stranger's audience in a public repository.
          # Naming the tag is the only evidence that the person asking meant this site.
          target="$SITE_TAG"

          if [ -z "$target" ]; then
            {
              echo
              echo "No **site_tag** was given, so no audience detail is reported. Re-run with one of the tags above — naming it is what says the site is yours to publish."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- 3. That site's audience ------------------------------------------------
          # shellcheck disable=SC2016
          detail_payload="$(jq -n \
            --arg query "$detail" \
            --arg accountTag "$CLOUDFLARE_ACCOUNT_ID" \
            --arg siteTag "$target" \
            --arg since "$since" \
            --arg until "$until_" \
            '{query: $query, variables: {accountTag: $accountTag, siteTag: $siteTag, since: $since, until: $until}}')"

          run_query "$detail_payload" "Audience query" result.json

          {
            echo
            printf -- "### Audience for \`%s\`\n" "$target"
            echo
            echo "Full response is attached as the \`web-analytics-result\` artifact."
            echo '```json'
            head -c 200000 result.json
            if [ "$(wc -c < result.json)" -gt 200000 ]; then
              echo
              echo "… truncated, see the artifact for the full response …"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Both files, because the discovery response is the one that carries the
          # diagnosis when the first query fails — and when it does, `set -e` ends the step
          # before result.json is ever written, so uploading that alone discards the very
          # answer the run produced. `discovery.json` names site tags and nothing else:
          # no counts, no countries, no referrers.
          name: web-analytics-result
          path: |
            discovery.json
            result.json
          if-no-files-found: warn
          retention-days: 7
