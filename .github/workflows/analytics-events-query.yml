name: Analytics events query

# Manual, on-demand read of the justdummies_measurement Analytics Engine
# dataset (see wrangler.jsonc and worker/index.ts §15.2/§15.3 for the schema:
# blob1=event, blob2=placement, blob3=variant, blob4=locale, blob5=chain,
# double1=ordinal).
# blob3 is empty for an event that has no door to choose between — the download
# control's clicks, ADR-0023 — so the default query below groups by it anyway and
# shows them under a blank variant rather than dropping them. blob5 is the
# playground's anonymised chain (ADR-0024) and is empty everywhere else, which is
# why the default query leaves it out: add it when reading generate-clicked.
# Results land in the run's job summary (truncated) and as a downloadable
# artifact (full), never in a committed file.
on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SQL to run against justdummies_measurement'
        required: true
        # sum(_sample_interval), not count(): see deployment-en.md ("sum(_sample_interval), not
        # count()") — Analytics Engine can sample once a dataset gets busy, and count() would then
        # silently undercount.
        default: >-
          SELECT blob1 AS event, blob2 AS placement, blob3 AS variant, blob4 AS locale,
          sum(_sample_interval) AS hits
          FROM justdummies_measurement
          WHERE timestamp > NOW() - INTERVAL '7' DAY
          GROUP BY blob1, blob2, blob3, blob4
          ORDER BY hits DESC
          LIMIT 50

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run query against Analytics Engine
        env:
          # A separate, read-only token — see deployment-en.md ("The deploy token cannot do
          # this"): the deploy token's Edit Cloudflare Workers template carries no Analytics
          # permission, so the SQL API needs an account-scoped Analytics Read token instead.
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SQL: ${{ inputs.sql }}
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' \
            --connect-timeout 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_ANALYTICS_TOKEN}" \
            --data-raw "${SQL}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/analytics_engine/sql")"
          status="$(tail -n1 <<<"$response")"
          body="$(sed '$d' <<<"$response")"
          echo "$body" > result.json

          # THE SUMMARY CARRIES NO MEASUREMENT. This repository is public, so a job
          # summary is a durable, browsable page anyone can read — and it used to hold the
          # whole response. It now holds only what tells a maintainer whether the run
          # worked; the rows themselves travel in the artifact, which is the transport this
          # data actually needs and which expires in a day.
          rows="$(jq -r '.rows // "unknown"' result.json 2>/dev/null || echo unknown)"

          {
            echo "### Query"
            echo '```sql'
            echo "$SQL"
            echo '```'
            echo
            echo "HTTP status: $status"
            echo
            echo "### Result"
            echo "Rows returned: $rows — in the \`analytics-result\` artifact, not here."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ge 300 ]; then
            echo "Query failed with status $status" >&2
            exit 1
          fi

      - name: Upload full result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: analytics-result
          path: result.json
          # One day: long enough for the reader this run was launched for, short enough
          # that the payload is not left lying around in a public repository.
          retention-days: 1
