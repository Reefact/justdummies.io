name: build

# Build the whole deployment and check it, on every pull request and on every push
# to main. This is what turns `pnpm build` from something that works on a
# maintainer's machine into something the repository guarantees.
#
# It runs the same scripts a maintainer runs, deliberately: a pipeline that
# reimplements the local build in YAML drifts from it, and the drift is only ever
# discovered when one of the two is wrong.

on:
  pull_request:
  push:
    # main is built and verified on every push, and publishes nothing. A release tag
    # is what publishes — see the deploy job.
    branches: [main]
    tags: ['release/*']
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch makes an in-flight run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify the artefact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Before setup-node, so its pnpm cache has a pnpm to work with. The version
      # comes from package.json's packageManager field, so CI and a maintainer's
      # machine cannot use different ones.
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # Before the site is built, because a snippet the library diagnoses is a
      # defect in what the site would teach, and finding it after a two-minute
      # build wastes the two minutes.
      - name: Validate the published snippets
        run: ./scripts/validate-snippets.sh

      # --frozen-lockfile: CI installs what the lockfile says or fails. A CI run
      # that silently resolves a different tree than the committed one is testing
      # something nobody has.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the site
        run: pnpm check

      # Builds the site, publishes the playground into it, generates the response
      # headers, and asserts the artefact's shape — all through scripts/, the same
      # ones `pnpm build` runs locally.
      - name: Build the artefact
        run: pnpm build

      # The build regenerates what the site displays. If the committed copies differ,
      # the repository holds values nobody drew and code nobody compiled — and the
      # review that approved them was reading fiction. Failing here is how the diff
      # stays honest.
      - name: Check the generated content is committed and current
        run: |
          if ! git diff --exit-code -- apps/site/src/generated/; then
            echo "::error title=Generated content is stale::Run 'pnpm build' and commit apps/site/src/generated/."
            exit 1
          fi

      - name: Check the size budgets
        run: ./scripts/check-budgets.sh

      # The checks above read the artefact on disk. This one starts the runtime and
      # asks it, which is a different claim: a rule can be present, well formed, and
      # ignored. That has happened here — a redirect rule was discarded silently for
      # months' worth of builds while every on-disk check passed.
      - name: Check what the runtime actually serves
        run: ./scripts/check-served-headers.sh

      - name: Upload the artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: dist/
          retention-days: 7
          # The deployment is a directory of many small files; keeping them
          # uncompressed in the artefact would multiply the upload for no gain.
          compression-level: 6
          # dist/.assetsignore is a dotfile, and this action drops dotfiles unless
          # told otherwise. Losing it is silent in both directions: the artefact still
          # publishes, and whatever the file was meant to keep out of the upload goes
          # up with everything else. The deploy job re-runs verify-output.sh on what it
          # downloads, which is what turns this line from a hope into a guarantee.
          include-hidden-files: true

  # Publish the artefact the build job verified — by downloading it, not by building
  # again. A deploy job that rebuilds publishes bytes no check has ever seen.
  #
  # There is no wrangler-action here, deliberately. The repository pins one wrangler in
  # package.json, and `pnpm run deploy` is the command a maintainer runs by hand; a
  # pipeline that fetches a different wrangler than the lockfile's is publishing with a
  # version nobody has tested. Same reason the build job runs scripts/ rather than
  # reimplementing the build in YAML.
  #
  # Every step up to the last one runs whether or not the credentials exist. That is
  # the point: without them the job still proves the artefact survives the round trip
  # through the artefact store, which is the failure this job is most likely to meet
  # first.
  deploy:
    name: Deploy
    needs: build
    # A TAG PUBLISHES. A branch does not, including main.
    #
    # The unit of publication is a release someone decided to make, not a commit
    # someone happened to merge. Pushing release/2026-08-11T19-33-42Z deploys; forty
    # commits on main deploy nothing.
    #
    # The tag is a UTC timestamp, not a semantic version. Semver answers "is this
    # compatible with what I have", and nothing consumes this site, so the question
    # never arises — while the arbitration it demands (minor or patch, for a landing
    # page?) is pure cost. A timestamp is generated by `date -u`, needs no prior look
    # at `git tag` to know what comes next, cannot collide, and sorts lexically into
    # chronological order.
    #
    # It also matches the unit Cloudflare reports. `wrangler deployments list` prints
    # timestamps, so a timestamped tag lines up against it directly, which is the
    # whole reason for naming releases at all.
    #
    # The cost is real and worth naming: main can sit ahead of production
    # indefinitely, and nothing here will say so. A skipped Deploy on a push to main
    # is the expected state, not a symptom.
    #
    # The gate is the ref alone. A tag reaches this whether it was pushed or picked
    # in the Run workflow dialog — GitHub's ref selector lists tags — so re-deploying
    # a release needs no second mechanism, and no event can publish something that
    # was never tagged.
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Only wrangler is needed here, but the whole workspace is installed anyway: the
      # lockfile is the one the build job used, and resolving a narrower tree would be
      # a second dependency graph to reason about for no gain.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the verified artefact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site
          path: dist

      # The same script the build job ran, now against the bytes that will actually be
      # uploaded. It costs seconds, and it is the only thing that would notice the
      # artefact losing a file between the two jobs.
      - name: Verify the artefact as downloaded
        run: ./scripts/verify-output.sh

      # Announced rather than failed while the account does not exist yet: a red
      # pipeline on every push to main would say nothing useful and teach everyone to
      # ignore it. Once both secrets are set this branch is never taken again.
      - name: Publish to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            missing="CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            missing="${missing:+${missing} and }CLOUDFLARE_ACCOUNT_ID"
          fi

          if [ -n "${missing}" ]; then
            echo "::notice title=Deployment skipped::${missing} not configured, so nothing was published. The artefact was built, verified, and verified again after download. docs/for-maintainers/deployment-en.md walks through creating them, with a check after every step."
            exit 0
          fi

          pnpm run deploy

  # A release is the human-readable half of what a tag already does. The tag publishes;
  # this gives it a page listing what went out since the previous one, which is where
  # somebody actually looks. A CHANGELOG.md would be the same list kept by hand, and
  # nothing consumes this site, so nobody needs a compatibility note about it.
  #
  # Its own job, for one reason: creating a release needs `contents: write`, and the
  # narrowest place to grant that is a job that does nothing else. Deploy keeps the
  # read-only token it has always had, and nothing that touches Cloudflare credentials
  # ever holds a token that can write to the repository.
  #
  # `needs: deploy` rather than the tag alone, so a release names something that
  # shipped. One caveat worth stating: the deploy step exits 0 when the Cloudflare
  # secrets are absent, so this would still publish a release for a deployment that
  # announced itself skipped. That branch is dead now that both secrets exist, and
  # making this job read the other's mind would cost more than the case is worth.
  notes:
    name: Release notes
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag object itself, not only the commit it points at: its annotation is
          # the release's title, and that message does not come with a shallow fetch.
          fetch-depth: 0

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"

          # Re-runnable. A tag can reach this twice — the Run workflow dialog lists tags,
          # and re-deploying a release is a supported thing to do — and a second attempt
          # must not fail the pipeline over a page that already exists.
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "::notice title=Release already exists::${tag} has a release already; left as it is."
            exit 0
          fi

          # The subject of the annotated tag, which is the sentence written at `git tag -m`.
          # Falling back to the tag's own name rather than failing: a dull title beats a red
          # pipeline over a deployment that has already gone out.
          title="$(git for-each-ref "refs/tags/${tag}" --format='%(contents:subject)')"

          gh release create "${tag}" \
            --title "${title:-${tag}}" \
            --generate-notes \
            --latest
