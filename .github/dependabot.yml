version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    # codeql-action ships init/analyze as separate actions that MUST run the same
    # version: a mismatched pair aborts the "CodeQL analyze" job. Group them into
    # one pull request so every step moves in lockstep.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
